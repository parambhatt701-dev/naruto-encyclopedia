    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-orange: #ff6600;
            --neon-blue: #00d4ff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        h1, h2, .neon-text {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Neon Glow Effect */
        .neon-glow {
            text-shadow: 0 0 5px var(--neon-orange), 
                         0 0 10px var(--neon-orange), 
                         0 0 20px var(--neon-orange);
            color: #fff;
        }

        .neon-border {
            border: 1px solid var(--neon-orange);
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.3);
        }

        /* Video Background Styling */
        #video-bg {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2;
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.9) 100%);
            z-index: -1;
        }

        /* Card Animations */
        .character-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: scale(0.9);
        }

        .character-card.show {
            opacity: 1;
            transform: scale(1);
        }

        .character-card:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: var(--neon-orange); border-radius: 10px; }

        .filter-btn.active {
            background-color: var(--neon-orange);
            color: black;
            box-shadow: 0 0 15px var(--neon-orange);
        }
    </style>
</head>

        function renderCharacters(filter = 'All') {
            const grid = document.getElementById('character-grid');
            grid.innerHTML = '';

            const filteredData = filter === 'All' 
                ? characters 
                : characters.filter(char => char.ranks.includes(filter));

            filteredData.forEach((char, index) => {
                const card = document.createElement('div');
                card.className = `character-card bg-black bg-opacity-60 rounded-xl overflow-hidden neon-border backdrop-blur-md`;
                
                card.innerHTML = `
                    <div class="relative h-64 overflow-hidden">
                        <img src="${char.image}" alt="${char.name}" class="w-full h-full object-cover">
                        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black to-transparent p-4">
                            <span class="text-xs font-bold bg-orange-600 text-white px-2 py-1 rounded uppercase">${char.ranks[0]}</span>
                        </div>
                    </div>
                    <div class="p-6">
                        <h3 class="text-2xl font-bold text-white mb-2 neon-text">${char.name}</h3>
                        <p class="text-sm text-gray-400 mb-4 line-clamp-3">${char.description}</p>
                        <div class="space-y-2 border-t border-gray-800 pt-4">
                            <div class="flex justify-between text-xs">
                                <span class="text-orange-500 font-bold uppercase">Status:</span>
                                <span class="${char.status.includes('Deceased') ? 'text-red-400' : 'text-green-400'}">${char.status}</span>
                            </div>
                            <div class="flex justify-between text-xs">
                                <span class="text-orange-500 font-bold uppercase">Signature:</span>
                                <span class="text-blue-300 italic">${char.ability}</span>
                            </div>
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
                
                // Staggered fade-in effect
                setTimeout(() => {
                    card.classList.add('show');
                }, index * 100);
            });
        }

        function filterCharacters(rank) {
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toUpperCase() === rank.toUpperCase() || 
                   (rank === 'Legendary Sannin' && btn.innerText === 'SANNIN')) {
                    btn.classList.add('active');
                }
            });

            // Re-render
            renderCharacters(rank);
        }

        // Initial Load
        window.onload = () => renderCharacters();
        function toggleMusic() {
    const music = document.getElementById('bg-music');
    const btnText = document.getElementById('music-text');
    const btn = document.getElementById('music-btn');

    if (music.paused) {
        music.play().catch(err => console.log("Audio waiting for user click interaction: ", err));
        btnText.innerText = "MUTE THEME";
        btn.style.boxShadow = "0 0 20px #00d4ff";
        btn.style.borderColor = "#00d4ff";
        btn.classList.add('text-cyan-400', 'border-cyan-400');
    } else {
        music.pause();
        btnText.innerText = "PLAY SOUNDTRACK";
        btn.style.boxShadow = "0 0 15px rgba(255, 102, 0, 0.4)";
        btn.style.borderColor = "#ff6600";
        btn.classList.remove('text-cyan-400', 'border-cyan-400');
    }
